services:
  multicamstudio:
    image: mcs-ros2:${ROS_DISTRO:-jazzy}
    pull_policy: never
    build:
      context: .
      dockerfile: build/Dockerfile
      target: runtime
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    network_mode: host
    # Host networking and IPC allow DDS discovery/shared memory with host ROS nodes.
    ipc: host
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # UDP also works with publishers in containers using private IPC namespaces.
      FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}
      ROS_IMAGE_TOPIC_TEMPLATE: ${ROS_IMAGE_TOPIC_TEMPLATE:-}
      CAMERA_CALIBRATION_FILE: /home/docker/workspace/cfg/CameraCalibrationSettings.json
      PORT: ${PORT:-5173}
      STREAMER_PORT: ${STREAMER_PORT:-8080}
      STREAMER_BITRATE_MBIT: ${STREAMER_BITRATE_MBIT:-4}
      CALIBRATION_DATA: /home/docker/workspace/data
      RECORD_FPS: ${RECORD_FPS:-30}
      RECORD_SYNC_TOLERANCE_MS: ${RECORD_SYNC_TOLERANCE_MS:-5}
      RECORD_START_TIMEOUT_SEC: ${RECORD_START_TIMEOUT_SEC:-15}
      RECORD_STALL_TIMEOUT_SEC: ${RECORD_STALL_TIMEOUT_SEC:-5}
      RECORD_ENCODER: ${RECORD_ENCODER:-libx264}
      CALIBRATION_CAPTURE_FRAMES: ${CALIBRATION_CAPTURE_FRAMES:-30}
      CALIBRATION_CAPTURE_INTERVAL_MS: ${CALIBRATION_CAPTURE_INTERVAL_MS:-500}
      CALIBRATION_MAX_REPROJECTION_ERROR_PX: ${CALIBRATION_MAX_REPROJECTION_ERROR_PX:-5}
      STREAMER_ENCODER: ${STREAMER_ENCODER:-libx264}
    volumes:
      - type: bind
        source: ${MCS_CONFIG_DIR:-./cfg}
        target: /home/docker/workspace/cfg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MCS_DATA_DIR:-./data}
        target: /home/docker/workspace/data
        bind:
          create_host_path: false
    stop_grace_period: 30s
